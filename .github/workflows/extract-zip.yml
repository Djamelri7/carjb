name: Extract CarCare ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e

          if [ ! -f "carjb.zip" ]; then
            echo "ERROR: carjb.zip not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q carjb.zip -d extracted

          echo "Searching for index.html..."

          if [ -f "extracted/index.html" ]; then
            PROJECT_DIR="extracted"
          else
            INDEX_PATH=$(find extracted -name index.html -type f | head -n 1)

            if [ -z "$INDEX_PATH" ]; then
              echo "ERROR: index.html not found"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$INDEX_PATH")
          fi

          echo "Project directory: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          rm -rf extracted
          rm -f carjb.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Extract CarCare project"
            git push
          fi
